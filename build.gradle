plugins {
    id 'fabric-loom' version '1.6-SNAPSHOT'
    id 'maven-publish'
}

group = maven_group
version = mod_version

base {
    archivesName = "copperdeco-fabric-${minecraft_version}"
}

repositories {
    mavenCentral()
    maven {
        url "https://cursemaven.com"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    modImplementation "curse.maven:vanillabackport-417430:${vanillabackport_file_id}"
    modImplementation files("libs/carpetscore-fabric-1.20.1-1.1.0.jar")
}

loom {
    mixin {
        defaultRefmapName.set("copperdeco.refmap.json")
    }
}

apply from: 'port-resources.gradle'

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand(version: project.version)
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}
