name: Fabric build

on:
  push:
    branches:
      - 26.2-fabric
      - 26.3-fabric
  pull_request:
    branches:
      - 26.2-fabric
      - 26.3-fabric
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Fabric mod
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon --stacktrace
      - name: Verify packaged resources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          jars = [p for p in Path("build/libs").glob("*.jar") if "-sources" not in p.name]
          assert len(jars) == 1, f"Expected one mod JAR, found: {jars}"
          with ZipFile(jars[0]) as archive:
              entries = set(archive.namelist())
              assert "fabric.mod.json" in entries
              assert "copperdeco.mixins.json" in entries
              for directory in ("assets/copperdeco/blockstates/", "assets/copperdeco/items/", "data/copperdeco/loot_table/blocks/"):
                  count = sum(path.startswith(directory) and path.endswith(".json") for path in entries)
                  assert count >= 32, f"{directory} only contains {count} tile resources"
          print(f"Validated Fabric mod: {jars[0]}")
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: copperdeco-fabric-${{ github.ref_name }}
          path: build/libs/*.jar
          if-no-files-found: error
