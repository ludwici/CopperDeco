plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
    id 'me.modmuss50.mod-publish-plugin' version '2.2.1'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = "${project.archives_base_name}-fabric-${minecraft_version}"
}

repositories {
    mavenCentral()
    maven {
        url "https://cursemaven.com"
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "copperdeco" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation "curse.maven:carpets-core-1140721:${project.carpetcore_file_id}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "carpetcore_version", project.carpetcore_version

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version, "carpetcore_version": inputs.properties.carpetcore_version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}

publishMods {
    file = tasks.named("remapJar").flatMap { it.archiveFile }
    changelog = "Added Minecraft 26.3 support for Fabric. Requires Carpets Core 1.3.1."
    version = "${minecraft_version}-${mod_version}"
    displayName = tasks.named("remapJar").flatMap { it.archiveFile }.map { it.asFile.name }
    type = STABLE
    modLoaders.add("fabric")
    dryRun = providers.gradleProperty("publishDryRun").map { it.toBoolean() }.orElse(false)

    curseforge {
        projectId = "1362062"
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        minecraftVersions.add(minecraft_version)
        javaVersions.add(JavaVersion.VERSION_25)
        client = true
        server = true
        requires("fabric-api")
        requires("carpets-core")
    }
}
