plugins {
    id 'me.modmuss50.mod-publish-plugin' version '2.2.1'
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}

group = mod_group_id
version = mod_version

base {
    archivesName = "copperdeco-forge-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'NeoForged ModLauncher Mirror'
                url = uri('https://maven.neoforged.net/releases')
            }
        }
        filter {
            includeGroup 'cpw.mods'
        }
    }
    mavenCentral()
    maven {
        url "https://cursemaven.com"
    }
    maven {
        url "https://repo.spongepowered.org/repository/maven-public/"
    }
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')
            mods {
                copperdeco {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            args '--nogui'
            mods {
                copperdeco {
                    source sourceSets.main
                }
            }
        }
    }
}

mixin {
    add(sourceSets.main, "copperdeco.refmap.json")
    config("copperdeco.mixins.json")
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf(files("libs/carpetscore-forge-1.20.1-1.1.0.jar"))
    implementation fg.deobf("curse.maven:vanillabackport-417430:${vanillabackport_file_id}")
    annotationProcessor("org.spongepowered:mixin:0.8.5-SNAPSHOT:processor")
}

apply from: 'port-resources.gradle'

processResources {
    inputs.property "version", project.version
    filesMatching("META-INF/mods.toml") {
        expand(version: project.version)
    }
}

jar {
    manifest {
        attributes(["MixinConfigs": "copperdeco.mixins.json"])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

publishMods {
    file = tasks.named("jar", Jar).flatMap { it.archiveFile }
    changelog = "Backport of Copper Deco to Minecraft 1.20.1."
    version = "${minecraft_version}-${mod_version}-forge"
    displayName = tasks.named("jar", Jar).flatMap { it.archiveFile }.map { it.asFile.name }
    type = STABLE
    modLoaders.add("forge")
    dryRun = providers.gradleProperty("publishDryRun").map { it.toBoolean() }.orElse(false)

    curseforge {
        projectId = "1362062"
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        minecraftVersions.add(minecraft_version)
        javaVersions.add(JavaVersion.VERSION_17)
        client = true
        server = true
        requires("carpets-core")
        requires("vanillabackport")
    }

    modrinth {
        projectId = providers.gradleProperty("modrinthProjectId").orElse("copperdeco")
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        version = "${minecraft_version}-${mod_version}-forge"
        minecraftVersions.add(minecraft_version)
        requires("carpets-core")
        requires("vanillabackport")
    }
}
