plugins {
    id 'java-library'
    id 'maven-publish'
    id 'me.modmuss50.mod-publish-plugin' version '2.2.1'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        url "https://cursemaven.com"
    }
}

base {
    archivesName = "${mod_id}-neo-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()

            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "curse.maven:carpets-core-1140721:9585810"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            mod_id                 : mod_id,
            mod_url                : mod_url,
            mod_issues_url         : mod_issues_url,
            mod_license_url        : mod_license_url,
            carpetcore_version     : carpetcore_version,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

publishMods {
    file = tasks.named("jar", Jar).flatMap { it.archiveFile }
    changelog = "Minecraft 26.2 support; updated Carpets Core dependency to 1.3.2; updated mod metadata."
    version = "${minecraft_version}-${mod_version}"
    displayName = tasks.named("jar", Jar).flatMap { it.archiveFile }.map { it.asFile.name }
    type = STABLE
    modLoaders.add("neoforge")
    dryRun = providers.gradleProperty("publishDryRun").map { it.toBoolean() }.orElse(false)

    curseforge {
        projectId = "1362062"
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        minecraftVersions.add(minecraft_version)
        javaVersions.add(JavaVersion.VERSION_25)
        client = true
        server = true
        requires("carpets-core")
    }

    modrinth {
        projectId = providers.gradleProperty("modrinthProjectId").orElse("copper-deco")
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        version = "${minecraft_version}-${mod_version}"
        minecraftVersions.add(minecraft_version)
        requires("carpets-core")
    }
}
