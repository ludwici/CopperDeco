name: Build NeoForge 26.2

on:
  push:
    branches:
      - 26.2-neo
  pull_request:
    branches:
      - 26.2-neo
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate generated data
        run: |
          chmod +x gradlew
          ./gradlew runData --no-daemon --stacktrace

      - name: Build mod
        run: ./gradlew clean build --no-daemon --stacktrace

      - name: Verify packaged resources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from struct import unpack
          from urllib.parse import urlparse
          from zipfile import ZipFile
          import tomllib

          jars = list(Path("build/libs").glob("copperdeco-neo-26.2-*.jar"))
          assert len(jars) == 1, f"Expected one mod JAR, found: {jars}"
          with ZipFile(jars[0]) as jar:
              files = set(jar.namelist())
              for folder in (
                  "assets/copperdeco/blockstates/",
                  "assets/copperdeco/items/",
                  "data/copperdeco/loot_table/blocks/",
              ):
                  count = sum(path.startswith(folder) and path.endswith(".json") for path in files)
                  assert count >= 32, f"{folder}: expected 32 tile resources, found {count}"
              assert "META-INF/neoforge.mods.toml" in files, "Missing NeoForge metadata"
              metadata = tomllib.loads(jar.read("META-INF/neoforge.mods.toml").decode("utf-8"))
              mod = next(m for m in metadata["mods"] if m["modId"] == "copperdeco")
              assert "logoFile" not in mod, "Deprecated logoFile does not populate the mod list icon"
              assert mod.get("iconFile") == "copperdeco.png", "NeoForge requires iconFile for the mod list"
              assert mod.get("iconBlur") is True, "Expected smooth logo scaling"
              icon = mod["iconFile"]
              assert icon in files, f"Missing mod list icon in JAR root: {icon}"
              png = jar.read(icon)
              assert png[:8] == b"\\x89PNG\\r\\n\\x1a\\n", "Icon is not a PNG"
              assert png[12:16] == b"IHDR", "Icon has no PNG IHDR chunk"
              width, height = unpack(">II", png[16:24])
              assert width == height and width > 0, f"Expected a square mod icon, got {width}x{height}"
              for url in (mod["displayURL"], metadata["issueTrackerURL"], metadata["licenseURL"]):
                  parsed = urlparse(url)
                  assert parsed.scheme == "https" and parsed.netloc, f"Invalid metadata URL: {url}"
              assert mod["displayURL"] == "https://www.curseforge.com/minecraft/mc-mods/copper-deco"
              assert metadata["issueTrackerURL"] == "https://github.com/ludwici/CopperDeco/issues"
              assert metadata["licenseURL"] == "https://opensource.org/license/mit"
              print(f"Verified NeoForge icon: {icon} ({width}x{height})")
          print(f"Validated copper tile assets in {jars[0]}")
          PY

      - name: Upload mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: copperdeco-neoforge-26.2
          path: build/libs/*.jar
          if-no-files-found: error
