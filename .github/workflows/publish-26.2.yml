name: Publish Copper Deco 26.2 NeoForge

on:
  workflow_dispatch:
  push:
    branches:
      - 26.2-neo
    paths:
      - '.github/RELEASE_26_2'

permissions:
  contents: read

concurrency:
  group: copperdeco-26.2-neoforge-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release
        run: |
          chmod +x gradlew
          ./gradlew runData --no-daemon --stacktrace
          ./gradlew clean build --no-daemon --stacktrace
      - name: Check CurseForge token
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: test -n "$CURSEFORGE_TOKEN" || { echo "CURSEFORGE_TOKEN is missing"; exit 1; }
      - name: Publish CurseForge
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: ./gradlew publishCurseforge --no-daemon --stacktrace
      - name: Check Modrinth token
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: test -n "$MODRINTH_TOKEN" || { echo "MODRINTH_TOKEN is missing"; exit 1; }
      - name: Find or create Modrinth project
        id: modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: python3 .github/scripts/resolve_modrinth_project.py
      - name: Publish Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: ./gradlew publishModrinth -PmodrinthProjectId=${{ steps.modrinth.outputs.project_id }} --no-daemon --stacktrace
