plugins {
    id 'me.modmuss50.mod-publish-plugin' version '2.2.1'
    id 'dev.architectury.loom' version '1.9-SNAPSHOT'
    id 'maven-publish'
}

group = maven_group
version = mod_version

base {
    archivesName = "copperdeco-fabric-${minecraft_version}"
}

repositories {
    mavenCentral()
    maven {
        url "https://cursemaven.com"
    }
}

dependencies {
    minecraft "net.minecraft:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    modImplementation "curse.maven:vanillabackport-417430:${vanillabackport_file_id}"
    modImplementation files("libs/carpetscore-fabric-1.20.1-1.1.0.jar")
}

loom {
    mixin {
        defaultRefmapName.set("copperdeco.refmap.json")
    }
}

apply from: 'port-resources.gradle'

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand(version: project.version)
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

publishMods {
    file = tasks.named("remapJar").flatMap { it.archiveFile }
    changelog = "Backport of Copper Deco to Minecraft 1.20.1."
    version = "${minecraft_version}-${mod_version}-fabric"
    displayName = tasks.named("remapJar").flatMap { it.archiveFile }.map { it.asFile.name }
    type = STABLE
    modLoaders.add("fabric")
    dryRun = providers.gradleProperty("publishDryRun").map { it.toBoolean() }.orElse(false)

    curseforge {
        projectId = "1362062"
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        minecraftVersions.add(minecraft_version)
        javaVersions.add(JavaVersion.VERSION_17)
        client = true
        server = true
        requires("carpets-core")
        requires("vanillabackport")
    }

}
