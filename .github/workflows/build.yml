name: Build NeoForge 26.2

on:
  push:
    branches:
      - 26.2-neo
  pull_request:
    branches:
      - 26.2-neo
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon --stacktrace

      - name: Upload mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: copperdeco-neoforge-26.2
          path: build/libs/*.jar
          if-no-files-found: error
